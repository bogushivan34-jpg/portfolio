# Builds the static site and deploys it with its Worker to Cloudflare (worker/wrangler.jsonc) on every push to main.
# ivanbogush.ru reaches it through the relay on 45.136.228.66 (worker/relay/README.md).
# Repo secrets (Settings → Secrets and variables → Actions): WORKS_TOKEN, and CLOUDFLARE_API_TOKEN, a Cloudflare API
# token made from the "Edit Cloudflare Workers" template.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - run: npm run build
        env:
          # locks the list of previews at /works (app/works/page.tsx). Without it the page says the list isn't built.
          # The same value is in .env.local.
          WORKS_TOKEN: ${{ secrets.WORKS_TOKEN }}
      # the Worker and ../out, which the step above built
      - run: npx wrangler deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
